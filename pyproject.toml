[project]
name = "repo-ingest"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane", email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tiktoken (>=0.14.0,<0.15.0)",
    "pathspec (>=1.1.1,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
]

[project.optional-dependencies]
clipboard = [
    "pyperclip>=1.11,<2.0",
]

[tool.poetry]
packages = [{include = "repo_ingest", from = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.9,<0.17.0"
mypy = ">=2.3.1,<3.0.0"
pytest = ">=9.1.1,<10.0.0"
types-pyperclip = ">=1.11.0.20260508,<2.0.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
repo_ingest = "repo_ingest.cli:main"